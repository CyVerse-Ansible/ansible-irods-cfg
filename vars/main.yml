---
# These are the definitions of internal variables that are derived from the role variables providing
# default values and ensuring correct typing and safe formatting

_access_entries: "{{ irods_cfg_access_entries | d([]) }}"

_agent_factory_watcher_sleep_time: "{{ irods_cfg_agent_factory_watcher_sleep_time | d(none) }}"

_authentication_file: "{{ irods_cfg_authentication_file | d(none) }}"

_catalog_provider_hosts: "{{ irods_cfg_catalog_provider_hosts | d([inventory_hostname]) }}"
_catalog_service_role: "{{ irods_cfg_catalog_service_role | d('provider') }}"

_client_api_allowlist_policy: "{{ irods_cfg_client_api_allowlist_policy | d('enforce') }}"
_client_authentication_scheme: "{{ irods_cfg_client_authentication_scheme | d(none) }}"
_client_default_hash_scheme: >-
  {{ irods_cfg_client_default_hash_scheme if irods_cfg_client_default_hash_scheme | d(none) else
    _client_default_hash_scheme_default | d(none) }}
_client_default_resource: >-
  {{ irods_cfg_client_default_resource if irods_cfg_client_default_resource | d(none) else
    _client_default_resource_default | d(none) }}
_client_encryption_algorithm: >-
  {{ irods_cfg_client_encryption_algorithm if irods_cfg_client_encryption_algorithm | d(none) else
    _client_encryption_algorithm_default | d(none) }}
_client_encryption_key_size: >-
  {{ irods_cfg_client_encryption_key_size
      if irods_cfg_client_encryption_key_size | d(none)
        or irods_cfg_client_encryption_key_size | d(none) == 0 else
    _client_encryption_key_size_default | d(none) }}
_client_encryption_num_hash_rounds: >-
  {{ irods_cfg_client_encryption_num_hash_rounds
    if irods_cfg_client_encryption_num_hash_rounds | d(none)
       or irods_cfg_client_encryption_num_hash_rounds | d(none) == 0 else
  _client_encryption_num_hash_rounds_default | d(none) }}
_client_encryption_salt_size: >-
  {{ irods_cfg_client_encryption_salt_size
      if irods_cfg_client_encryption_salt_size | d(none)
        or irods_cfg_client_encryption_salt_size | d(none) == 0 else
    _client_encryption_salt_size_default | d(none) }}
_client_log_level: "{{ irods_cfg_client_log_level | d(none) }}"
_client_server_negotiation: >-
  {{ irods_cfg_client_server_negotiation if irods_cfg_client_server_negotiation | d(none) else
    'off' if irods_cfg_client_server_negotiation | d(none) == false else
    _client_server_negotiation_default | d(none) }}
_client_server_policy: >-
  {{ irods_cfg_client_server_policy if irods_cfg_client_server_policy | d(none) else
    _client_server_policy_default | d(none) }}

_chown: "{{ irods_cfg_chown | d(true) }}"

_connection_pool_refresh_time: >-
  {{ irods_cfg_connection_pool_refresh_time
      if irods_cfg_connection_pool_refresh_time | d(none) else
    _connection_pool_refresh_time_default | d(none) }}

_controlled_user_connection_list:
  control_type: "{{ irods_cfg_controlled_user_connection_list.control_type | d('denylist') }}"
  users: "{{ irods_cfg_controlled_user_connection_list.users | d([]) }}"

_cwd: "{{ irods_cfg_cwd if irods_cfg_cwd | d(none) else _cwd_default | d(omit) }}"

_database: "{{ __database_guess if _catalog_service_role == 'provider' else none }}"
_database_user_password_salt: "{{ irods_cfg_database_user_password_salt | d(none) }}"

_debug: "{{ irods_cfg_debug | d(none) }}"

_default_dir_mode: "{{ irods_cfg_default_dir_mode | d('0750') }}"
_default_file_mode: "{{ irods_cfg_default_file_mode | d('0600') }}"
_default_hash_scheme: "{{ irods_cfg_default_hash_scheme | d('SHA256') }}"
_default_number_of_transfer_threads: >-
  {{ irods_cfg_default_number_of_transfer_threads
      if irods_cfg_default_number_of_transfer_threads | d(none) is not none else
    _default_number_of_transfer_threads_default | d(none) }}
_default_resource_directory: "{{ irods_cfg_default_resource_directory | d(none) }}"
_default_resource_name: "{{ irods_cfg_default_resource_name | d('demoResc') }}"
_default_temporary_password_lifetime: "{{ irods_cfg_default_temporary_password_lifetime | d(120) }}"

_delay_rule_executors: "{{ irods_cfg_delay_rule_executors | d(none) }}"
_delay_server_sleep_time: "{{ irods_cfg_delay_server_sleep_time | d(none) }}"

_environment_file: >-
  {{ irods_cfg_environment_file if irods_cfg_environment_file | d(none) else
    _environment_file_default | d('home/' ~ _system_account_name ~ '/.irods/irods_environment.json') }}
_environment_variables: >-
  {{ (irods_cfg_environment_variables if irods_cfg_environment_variables | d(none) else {})
    | combine(
      {'IRODS_DATABASE_USER_PASSWORD_SALT': _database_user_password_salt}
        if _database_user_password_salt else
      {}) }}

_federation: "{{ irods_cfg_federation | d([]) }}"

_for_server: "{{ irods_cfg_for_server | d(false) }}"

_gsi_server_dn: "{{ irods_cfg_gsi_server_dn | d(none) }}"

_home: "{{ irods_cfg_home if irods_cfg_home | d(none) else _home_default | d(omit) }}"

_host: "{{ irods_cfg_host | d(inventory_hostname) }}"
_host_entries: "{{ irods_cfg_host_entries | d([]) }}"

_log_level: "{{ irods_cfg_log_level | d({}) }}"

_match_hash_policy: >-
  {{ irods_cfg_match_hash_policy if irods_cfg_match_hash_policy | d(none) else
    _match_hash_policy_default | d(none) }}

_maximum_connections: "{{ irods_cfg_maximum_connections | d(none) }}"
_maximum_size_of_delay_queue: "{{ irods_cfg_maximum_size_of_delay_queue | d(none) }}"
_maximum_size_for_single_buffer: >-
  {{ irods_cfg_maximum_size_for_single_buffer
      if irods_cfg_maximum_size_for_single_buffer | d(none) else
    _maximum_size_for_single_buffer_default | d(none) }}

_maximum_temporary_password_lifetime: >-
  {{ irods_cfg_maximum_temporary_password_lifetime | d(1000) }}

_migrate_delay_server_sleep_time: "{{ irods_cfg_migrate_delay_server_sleep_time | d(none) }}"

_negotiation_key: "{{ irods_cfg_negotiation_key | d('TEMPORARY_32byte_negotiation_key') }}"

_number_of_concurrent_delay_rule_executors: >-
  {{ irods_cfg_number_of_concurrent_delay_rule_executors | d(none) }}

_plugins_home: "{{ irods_cfg_plugins_home | d(none) }}"

_re: "{{ __re_guess if irods_cfg_re is not none else none }}"

_root_dir: >-
  {{ irods_cfg_root_dir | regex_replace('\\/$', '') if irods_cfg_root_dir | d(none) else '' }}

_rule_engine_namespaces: "{{ irods_cfg_rule_engine_namespaces | d(['']) }}"

_schema_validation_base_uri: >-
  {{ irods_cfg_schema_validation_base_uri | d('file:///var/lib/irods/configuration_schemas') }}
_schema_version: v4

_server_control_plane_encryption_algorithm: >-
  {{ irods_cfg_server_control_plane_encryption_algorithm
      if irods_cfg_server_control_plane_encryption_algorithm | d(none) else
    _server_control_plane_encryption_algorithm_default | d(none) }}
_server_control_plane_encryption_num_hash_rounds: >-
  {{ irods_cfg_server_control_plane_encryption_num_hash_rounds
      if irods_cfg_server_control_plane_encryption_num_hash_rounds | d(none) is not none else
    _server_control_plane_encryption_num_hash_rounds_default | d(none) }}
_server_control_plane_key: >-
  {{ irods_cfg_server_control_plane_key if irods_cfg_server_control_plane_key | d(none) else
    _server_control_plane_key_default | d(none) }}
_server_control_plane_port: >-
  {{ irods_cfg_server_control_plane_port if irods_cfg_server_control_plane_port | d(none) else
    _server_control_plane_port_default | d(none) }}
_server_control_plane_timeout: "{{ irods_cfg_server_control_plane_timeout | d(10000) }}"
_server_port_range_end: "{{ irods_cfg_server_port_range_end | d(20199) }}"
_server_port_range_start: "{{ irods_cfg_server_port_range_start | d(20000) }}"

_ssl_ca_certificate_file: "{{ irods_cfg_ssl_ca_certificate_file | d(none) }}"
_ssl_ca_certificate_path: "{{ irods_cfg_ssl_ca_certificate_path | d(none) }}"
_ssl_certificate_chain_file: "{{ irods_cfg_ssl_certificate_chain_file | d(none) }}"
_ssl_certificate_key_file: "{{ irods_cfg_ssl_certificate_key_file | d(none) }}"
_ssl_dh_params_file: "{{ irods_cfg_ssl_dh_params_file | d(none) }}"
_ssl_verify_server: "{{ irods_cfg_ssl_verify_server | d(none) }}"

_stacktrace_file_processor_sleep_time: >-
  {{ irods_cfg_stacktrace_file_processor_sleep_time | d(none) }}

_system_account_name: "{{ irods_cfg_system_account_name | d('irods') }}"
_system_group_name: "{{ irods_cfg_system_group_name | d(_system_account_name) }}"

_tcp_keepalive_intvl: "{{ irods_cfg_tcp_keepalive_intvl | d(none) }}"
_tcp_keepalive_probes: "{{ irods_cfg_tcp_keepalive_probes | d(none) }}"
_tcp_keepalive_time: "{{ irods_cfg_tcp_keepalive_time | d(none) }}"

_transfer_buffer_size_for_parallel_transfer: >-
  {{ irods_cfg_transfer_buffer_size_for_parallel_transfer
      if irods_cfg_transfer_buffer_size_for_parallel_transfer | d(none) else
    _transfer_buffer_size_for_parallel_transfer_default | d(none) }}
_transfer_chunk_size_for_parallel_transfer: >-
  {{ irods_cfg_transfer_chunk_size_for_parallel_transfer
      if irods_cfg_transfer_chunk_size_for_parallel_transfer | d(none) else
    40 }}

_validate: "{{ irods_cfg_validate | d(false) }}"

_zone_auth_scheme: "{{ irods_cfg_zone_auth_scheme | d('native') }}"
_zone_key: "{{ irods_cfg_zone_key | d('TEMPORARY_zone_key') }}"
_zone_name: "{{ irods_cfg_zone_name | d('tempZone') }}"
_zone_password: "{{ irods_cfg_zone_password | d('rods') }}"
_zone_port: "{{ irods_cfg_zone_port | d(1247) }}"
_zone_user: "{{ irods_cfg_zone_user | d('rods') }}"


# This is the value of _database if the server being configured is a catalog provider
__database_guess:
  catalog_database_type: "{{ irods_cfg_database.catalog_database_type | d('postgres') }}"
  db_host: "{{ irods_cfg_database.db_host | d('localhost') }}"
  db_name: "{{ irods_cfg_database.db_name | d('ICAT') }}"
  db_odbc_driver: "{{ irods_cfg_database.db_odbc_driver | d('PostgreSQL ANSI') }}"
  db_password: "{{ irods_cfg_database.db_password | d('testpassword') }}"
  db_port: "{{ irods_cfg_database.db_port | d(5432) }}"
  db_username: "{{ irods_cfg_database.db_username | d('irods') }}"

# This is the value of _re if a iRODS rule language rule engine is being configured
__re_guess:
  additional_data_variable_mappings: >-
    {{ irods_cfg_re.additional_data_variable_mappings | d([]) if irods_cfg_re is mapping else [] }}
  additional_function_name_mappings: >-
    {{ irods_cfg_re.additional_function_name_mappings | d([]) if irods_cfg_re is mapping else [] }}
  additional_rulebases: >-
    {{ irods_cfg_re.additional_rulebases | d([]) if irods_cfg_re is mapping else [] }}
